kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: slow-image-pull
nodes:
- role: control-plane
  image: kindest/node:latest
  kubeadmConfigPatches:
    - |
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: ClusterConfiguration
      apiServer:
        extraArgs:
          v: "4"
    - |
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          v: "4"

